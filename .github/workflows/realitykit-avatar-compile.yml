name: RealityKit Avatar Compile

on:
  push:
    branches:
      - feat/athlete-avatar-experience
    paths:
      - ".github/workflows/realitykit-avatar-compile.yml"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Build Athevia for iOS Simulator
        shell: bash
        run: |
          set -o pipefail
          xcodebuild             -project Athevia.xcodeproj             -scheme Athevia             -sdk iphonesimulator             -destination 'generic/platform=iOS Simulator'             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             build | tee /tmp/athevia-build.log

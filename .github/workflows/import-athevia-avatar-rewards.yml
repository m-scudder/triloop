name: Import Athevia HD Reward Avatar Assets

on:
  push:
    branches:
      - feat/athlete-avatar-experience
    paths:
      - ".github/workflows/import-athevia-avatar-rewards.yml"

permissions:
  contents: write

jobs:
  import-avatar-rewards:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/athlete-avatar-experience

      - name: Download rendered reward states
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "Athevia/Resources/Assets.xcassets/AvatarFemaleBalancedRunTopIvory.imageset"
          curl --fail --location --retry 3 \
            'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/3e0406e9-9936-4715-8119-6425a8db8929/c10f98e1-cf16-440d-99b1-f7eab7e6228b/Edit__athlete_while_preserving_the_exact_same_woman__face__h.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMTkzMmQ3MDJjZDQ0ZWU4YyIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDY0NzA0Mn0.LCOWeHLmUpCX9S5pcse1pXmLj0M0vQARIyXxTdXMlRM' \
            --output "Athevia/Resources/Assets.xcassets/AvatarFemaleBalancedRunTopIvory.imageset/athevia-female-balanced-run-top-ivory.png"

          cat > "Athevia/Resources/Assets.xcassets/AvatarFemaleBalancedRunTopIvory.imageset/Contents.json" <<'JSON'
          {
            "images" : [
              {
                "filename" : "athevia-female-balanced-run-top-ivory.png",
                "idiom" : "universal",
                "scale" : "1x"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          JSON

          mkdir -p "Athevia/Resources/Assets.xcassets/AvatarFemaleBalancedRunShoeCobalt.imageset"
          curl --fail --location --retry 3 \
            'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/aa5948ba-4538-4432-95f2-5f4f010e54d2/04d31849-b608-463a-84e9-73646363c70d/Edit__athlete_while_preserving_the_exact_same_woman__face__h.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYmQ4NjExMTFhYjA4MWMxNyIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDYyNzIxN30.rN00JqZx9S5Hc5DduhvocTsEeBHN3NjkoEjBVlm83M8' \
            --output "Athevia/Resources/Assets.xcassets/AvatarFemaleBalancedRunShoeCobalt.imageset/athevia-female-balanced-run-shoe-cobalt.png"

          cat > "Athevia/Resources/Assets.xcassets/AvatarFemaleBalancedRunShoeCobalt.imageset/Contents.json" <<'JSON'
          {
            "images" : [
              {
                "filename" : "athevia-female-balanced-run-shoe-cobalt.png",
                "idiom" : "universal",
                "scale" : "1x"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          JSON

      - name: Commit production assets and remove importer
        shell: bash
        run: |
          set -euo pipefail
          rm -f ".github/workflows/import-athevia-avatar-rewards.yml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add HD running reward avatar states"
          git push origin HEAD:feat/athlete-avatar-experience

name: Build Runtime Avatar USDZ Once

on:
  push:
    branches:
      - feat/athlete-avatar-experience
    paths:
      - ".github/workflows/avatar-runtime-usdz-once.yml"

permissions:
  contents: write

jobs:
  build-runtime-avatar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/athlete-avatar-experience

      - name: Download Blender 4.5 LTS
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3             https://download.blender.org/release/Blender4.5/blender-4.5.14-linux-x64.tar.xz             --output /tmp/blender.tar.xz
          mkdir -p /tmp/blender
          tar -xJf /tmp/blender.tar.xz -C /tmp/blender --strip-components=1
          /tmp/blender/blender --version

      - name: Install headless libraries
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             libegl1             libgl1             libgl1-mesa-dri             libx11-6             libxext6

      - name: Install MPFB
        shell: bash
        run: |
          set -euo pipefail
          /tmp/blender/blender --online-mode --command extension install -s -e mpfb

      - name: Download free avatar assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/athevia-avatar-packs

          curl --fail --location --retry 3             https://files2.makehumancommunity.org/asset_packs/makehuman_system_assets/makehuman_system_assets_cc0.zip             --output /tmp/athevia-avatar-packs/system.zip

          curl --fail --location --retry 3             https://files2.makehumancommunity.org/asset_packs/shirts01/shirts01_cc0.zip             --output /tmp/athevia-avatar-packs/shirts.zip

          curl --fail --location --retry 3             https://files2.makehumancommunity.org/asset_packs/pants01/pants01_cc0.zip             --output /tmp/athevia-avatar-packs/shorts.zip

      - name: Install avatar assets
        shell: bash
        run: |
          set -euo pipefail
          /tmp/blender/blender -b             --python tools/avatar_pipeline/install_asset_packs.py --             --pack /tmp/athevia-avatar-packs/system.zip             --pack /tmp/athevia-avatar-packs/shirts.zip             --pack /tmp/athevia-avatar-packs/shorts.zip

      - name: Build feminine runtime athlete
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/athevia-avatar
          mkdir -p Athevia/Resources/Avatar3D

          /tmp/blender/blender -b             --python tools/avatar_pipeline/bootstrap_mpfb_master.py --             --output /tmp/athevia-avatar/feminine.blend             --presentation feminine             --poses tools/avatar_pipeline/config/poses.json

          /tmp/blender/blender -b /tmp/athevia-avatar/feminine.blend             --python-exit-code 1             --python tools/avatar_pipeline/export_realitykit_usdz.py --             --output Athevia/Resources/Avatar3D/AtheviaAthleteFeminine.usdz

      - name: Build masculine runtime athlete
        shell: bash
        run: |
          set -euo pipefail

          /tmp/blender/blender -b             --python tools/avatar_pipeline/bootstrap_mpfb_master.py --             --output /tmp/athevia-avatar/masculine.blend             --presentation masculine             --poses tools/avatar_pipeline/config/poses.json

          /tmp/blender/blender -b /tmp/athevia-avatar/masculine.blend             --python-exit-code 1             --python tools/avatar_pipeline/export_realitykit_usdz.py --             --output Athevia/Resources/Avatar3D/AtheviaAthleteMasculine.usdz

      - name: Verify runtime packages
        shell: bash
        run: |
          set -euo pipefail
          test -s Athevia/Resources/Avatar3D/AtheviaAthleteFeminine.usdz
          test -s Athevia/Resources/Avatar3D/AtheviaAthleteMasculine.usdz
          ls -lh Athevia/Resources/Avatar3D/*.usdz

      - name: Commit runtime avatar packages and remove importer
        shell: bash
        run: |
          set -euo pipefail
          rm -f ".github/workflows/avatar-runtime-usdz-once.yml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add dynamic RealityKit athlete packages"
          git push origin HEAD:feat/athlete-avatar-experience

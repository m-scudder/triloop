name: Import Athevia HD Avatar Asset

on:
  push:
    branches:
      - feat/athlete-avatar-experience
    paths:
      - ".github/workflows/import-athevia-avatar-asset.yml"

permissions:
  contents: write

jobs:
  import-avatar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/athlete-avatar-experience

      - name: Download generated athlete asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "Athevia/Resources/Assets.xcassets/AvatarFemaleBalancedStarterRun.imageset"
          curl --fail --location --retry 3 \
            'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/ffc19624-c526-4b35-a3fb-83ef8c14383a/e295aa2e-45b3-443e-a1d2-93fa9de8947f/Single_standalone_full_body_premium_semi_realistic_3D_render.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZmExMWFkNjZlYzQzODRiNiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDYwNDkwMn0.NzFgosLdilbPUglKqFP3sAIO82qe_PLK9cJoIETI4bI' \
            --output "Athevia/Resources/Assets.xcassets/AvatarFemaleBalancedStarterRun.imageset/athevia-female-balanced-starter-run.png"

          cat > "Athevia/Resources/Assets.xcassets/AvatarFemaleBalancedStarterRun.imageset/Contents.json" <<'JSON'
          {
            "images" : [
              {
                "filename" : "athevia-female-balanced-starter-run.png",
                "idiom" : "universal",
                "scale" : "1x"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          JSON

      - name: Commit production asset and remove importer
        shell: bash
        run: |
          set -euo pipefail
          rm -f ".github/workflows/import-athevia-avatar-asset.yml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add first HD production athlete asset"
          git push origin HEAD:feat/athlete-avatar-experience

name: Temporary Athevia Validation

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-athevia-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  xcode:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.5
        run: |
          sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version

      - name: Select iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available
          UDID="$(xcrun simctl list devices available | grep -m1 -E 'iPhone [0-9]+' | grep -Eo '[0-9A-F-]{36}')"
          test -n "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and run unit tests
        run: |
          set -o pipefail
          xcodebuild test             -project Athevia.xcodeproj             -scheme Athevia             -destination "id=${{ steps.simulator.outputs.udid }}"             -only-testing:AtheviaTests             CODE_SIGNING_ALLOWED=NO

      - name: Run completion-pass UI regressions
        run: |
          set -o pipefail
          xcodebuild test             -project Athevia.xcodeproj             -scheme Athevia             -destination "id=${{ steps.simulator.outputs.udid }}"             -only-testing:AtheviaUITests/AtheviaUITests/testGeneralFitnessProgressUsesTrainingDirectionNotEventReadiness             -only-testing:AtheviaUITests/AtheviaUITests/testTriathlonProfileExposesExplicitOpenWaterSafetyControls             CODE_SIGNING_ALLOWED=NO

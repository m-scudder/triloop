name: Temporary Athevia Validation

on:
  push:
    branches:
      - feat/final-phase-correctness-pass

concurrency:
  group: temporary-athevia-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.5
        run: sudo xcode-select -s /Applications/Xcode_26.5.app

      - name: Select iPhone simulator
        id: simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; ids=[x["udid"] for runtime,items in d.items() if "iOS" in runtime for x in items if x["name"].startswith("iPhone") and x.get("isAvailable",False)]; print(ids[0] if ids else "")')
          test -n "$DEVICE_ID"
          echo "id=$DEVICE_ID" >> "$GITHUB_OUTPUT"

      - name: Build and run unit tests
        run: |
          xcodebuild test \
            -project Athevia.xcodeproj \
            -scheme Athevia \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -only-testing:AtheviaTests

name: Finalize RealityKit Avatar Packages Once

on:
  push:
    branches:
      - feat/athlete-avatar-experience
    paths:
      - ".github/workflows/avatar-usdz-finalize-once.yml"

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/athlete-avatar-experience

      - name: Install Blender MPFB and USD tools
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user usd-core

          curl --fail --location --retry 3             https://download.blender.org/release/Blender4.5/blender-4.5.14-linux-x64.tar.xz             -o /tmp/blender.tar.xz
          mkdir -p /tmp/blender
          tar -xJf /tmp/blender.tar.xz -C /tmp/blender --strip-components=1

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             libegl1 libgl1 libgl1-mesa-dri libx11-6 libxext6

          /tmp/blender/blender --online-mode --command extension install -s -e mpfb

      - name: Install free avatar assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/packs

          curl --fail --location --retry 3             https://files2.makehumancommunity.org/asset_packs/makehuman_system_assets/makehuman_system_assets_cc0.zip             -o /tmp/packs/system.zip
          curl --fail --location --retry 3             https://files2.makehumancommunity.org/asset_packs/shirts01/shirts01_cc0.zip             -o /tmp/packs/shirts.zip
          curl --fail --location --retry 3             https://files2.makehumancommunity.org/asset_packs/pants01/pants01_cc0.zip             -o /tmp/packs/pants.zip

          /tmp/blender/blender -b             --python tools/avatar_pipeline/install_asset_packs.py --             --pack /tmp/packs/system.zip             --pack /tmp/packs/shirts.zip             --pack /tmp/packs/pants.zip

      - name: Generate and validate runtime packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/avatar
          mkdir -p Athevia/Resources/Avatar3D

          for presentation in feminine masculine; do
            cap="$(tr '[:lower:]' '[:upper:]' <<< ${presentation:0:1})${presentation:1}"
            blend="/tmp/avatar/${presentation}.blend"
            usdz="Athevia/Resources/Avatar3D/AtheviaAthlete${cap}.usdz"

            /tmp/blender/blender -b               --python tools/avatar_pipeline/bootstrap_mpfb_master.py --               --output "${blend}"               --presentation "${presentation}"               --poses tools/avatar_pipeline/config/poses.json

            /tmp/blender/blender -b "${blend}"               --python-exit-code 1               --python tools/avatar_pipeline/validate_scene.py --               --catalog tools/avatar_pipeline/config/catalog.json               --poses tools/avatar_pipeline/config/poses.json

            /tmp/blender/blender -b "${blend}"               --python-exit-code 1               --python tools/avatar_pipeline/export_realitykit_usdz.py --               --output "${usdz}"

            python3 tools/avatar_pipeline/validate_usdz.py               --usdz "${usdz}"               --presentation "${presentation}"
          done

          ls -lh Athevia/Resources/Avatar3D/*.usdz

      - name: Commit validated packages
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/avatar-usdz-finalize-once.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Finalize stable RealityKit athlete packages"
          git pull --rebase origin feat/athlete-avatar-experience
          git push origin HEAD:feat/athlete-avatar-experience
